[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: fast isolated unit test, needs no external services",
    "integration: needs a real database or redis",
    "smoke: drives the running application end to end",
    "deploy: validates deployment artifacts (compose, Caddyfile, Dockerfile)",
    "contract: pins a repository boundary or policy invariant",
]

[tool.ruff.lint]
# Broad catches are existing error boundaries; narrow them in focused slices.
# Nested DB context managers are explicit and correct; flattening is style-only.
ignore = ["BLE001", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# Meter storage currently uses PostgreSQL TIMESTAMP and tests its naive contract.
"tests/test_meter_connectors.py" = ["DTZ001"]

[tool.mutmut]
# Scoped deliberately. A mutation pass over the whole tree would bury the signal
# from the two places a survivor actually costs something: the money path, and
# the import guard that decides whether a meter correction is noticed. Coverage
# reads high across store/ because the tests execute the surrounding Python
# while asserting only the shape of the SQL.
source_paths = ["billing_runner.py", "store/metering.py"]
