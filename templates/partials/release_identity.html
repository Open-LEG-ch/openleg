{% if release_identity %}
<div class="release-identity text-sm px-4 py-2">
  <a href="{{ release_identity.release_url }}">{{ _('Version %(tag)s', tag=release_identity.tag) }}</a>
  <details><summary>{{ _('Technische Angaben') }}</summary>
    <dl class="break-all">
      <dt>{{ _('Quellcode') }}</dt><dd><a href="{{ release_identity.source_url }}">{{ release_identity.source_sha }}</a></dd>
      <dt>{{ _('Container-Image') }}</dt><dd>{{ release_identity.image_digest }}</dd>
    </dl>
  </details>
</div>
{% endif %}
