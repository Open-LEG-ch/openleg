<nav aria-label="{{ _('LEG-Verwaltung') }}" class="min-w-0 border-b border-line lg:border-r lg:border-b-0">
  <ul class="m-0 flex list-none gap-1 overflow-x-auto p-3 lg:flex-col lg:py-6">
    {% for key, label in workspace_labels.items() %}
      {% if (key not in ("billing", "payments", "invoices") or workspace_billing)
            and (key != "settings" or workspace_billing or (is_admin and viewer_has_session)) %}
      <li class="shrink-0{% if key == 'members' and workspace_billing %} lg:mt-2 lg:border-t lg:border-line lg:pt-2{% endif %}">
        <a href="{{ workspace_overview if key == 'overview' else workspace_overview ~ '?page=' ~ key if demo else workspace_root ~ '/' ~ key }}"
           {% if key == page %}aria-current="page"{% elif key == section %}aria-current="true"{% endif %}
           class="flex min-h-12 items-center whitespace-nowrap rounded-lg px-3 py-2 lg:px-4 {% if key == section %}bg-brand text-white font-semibold underline underline-offset-4{% else %}text-ink hover:bg-paper-deep{% endif %}">{{ label }}</a>
      </li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
