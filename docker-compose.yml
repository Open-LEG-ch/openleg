services:
  flask:
    build: .
    container_name: openleg-flask
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://openleg:${POSTGRES_PASSWORD}@postgres:5432/openleg
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - flask_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: openleg-postgres
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      - POSTGRES_USER=openleg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=openleg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openleg"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web

  redis:
    image: redis:7-alpine
    container_name: openleg-redis
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - web

  caddy:
    image: caddy:latest
    container_name: openleg-caddy
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      flask:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  flask_data:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  web:
