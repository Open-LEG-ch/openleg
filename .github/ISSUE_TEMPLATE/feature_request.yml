name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before proposing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem does this solve? Who needs it?
      placeholder: As a [user type], I need [capability] so that [benefit]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would this feature work?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, alternatives considered
    validations:
      required: false
