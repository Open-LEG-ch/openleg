name: CI Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: ci/security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --no-banner \
            --exit-code 1

      - name: Enforce forbidden path policy
        shell: bash
        run: |
          set -euo pipefail
          POLICY_FILE=".github/forbidden-paths.txt"
          mapfile -t DENY_PATTERNS < <(grep -vE '^\s*($|#)' "${POLICY_FILE}")

          match_pattern() {
            local path="$1"
            local pattern
            for pattern in "${DENY_PATTERNS[@]}"; do
              if [[ "${path}" == ${pattern} ]]; then
                echo "${pattern}"
                return 0
              fi
            done
            return 1
          }

          fail=0

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            if pattern="$(match_pattern "${file}")"; then
              echo "::error file=${file}::Tracked forbidden path (pattern: ${pattern})"
              fail=1
            fi
          done < <(git ls-files)

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            CHANGED_FILES="$(git ls-tree -r --name-only "${HEAD_SHA}")"
          else
            CHANGED_FILES="$(git diff --name-only --diff-filter=ACMRTUXB "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            if pattern="$(match_pattern "${file}")"; then
              echo "::error file=${file}::Changed forbidden path (pattern: ${pattern})"
              fail=1
            fi
          done <<< "${CHANGED_FILES}"

          if [[ "${fail}" -ne 0 ]]; then
            echo "Forbidden path policy violation"
            exit 1
          fi

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Upload report artifact
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
