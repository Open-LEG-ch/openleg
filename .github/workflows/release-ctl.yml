name: Attach openleg-ctl release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0)
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

concurrency:
  group: release-ctl-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.6.1 packaging==26.3 pyproject-hooks==1.3.3 setuptools==84.2.1
          python -m build --no-isolation --outdir dist

      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv "${RUNNER_TEMP}/ctl-smoke"
          "${RUNNER_TEMP}/ctl-smoke/bin/python" -m pip install dist/*.whl

      - name: Verify wheel version and CLI
        working-directory: ${{ runner.temp }}
        run: |
          version="$("${RUNNER_TEMP}/ctl-smoke/bin/python" -c 'from importlib.metadata import version; print(version("openleg-ctl"))')"
          if [[ "${RELEASE_TAG}" != v* || "${version}" != "${RELEASE_TAG#v}" ]]; then
            printf '::error::Wheel version %s does not match release tag %s\n' "${version}" "${RELEASE_TAG}"
            exit 1
          fi
          "${RUNNER_TEMP}/ctl-smoke/bin/openleg-ctl" --help

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openleg-ctl
          path: dist/
          if-no-files-found: error
          overwrite: true

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openleg-ctl
          path: dist

      - name: Attach assets to the existing Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber -- *.whl *.tar.gz SHA256SUMS
