name: CI Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/site-**"]

# Keep only the newest run for each PR, without cancelling other stack layers.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each shard runs a round-robin slice of the suite on its own runner, with
  # its own PostgreSQL and Redis. The COUNT in --shard must equal the matrix size.
  shard:
    name: ci/test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openleg
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: openleg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openleg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Require sandbox process dependencies
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          python -c 'import ctypes; ctypes.CDLL("libseccomp.so.2")'

      - name: Run tests
        env:
          PYTEST_ADDOPTS: "--durations=30 -o faulthandler_timeout=120 --shard=${{ matrix.shard }}/6"
          DATABASE_URL: postgresql://openleg:testpass@localhost:5432/openleg
          OPENLEG_TEST_VEREIN_DATABASE_URL: postgresql://openleg:testpass@localhost:5432/openleg
          OPENLEG_TEST_FORECAST_REDIS_URL: redis://127.0.0.1:6379/15
        run: bash scripts/test.sh full

  # The required check. It always runs, so a failed or cancelled shard can
  # never leave ci/test skipped (GitHub treats a skipped check as passing).
  # The matrix result alone can read success when a leg never got a runner,
  # so it also requires every expected shard job to have succeeded.
  test:
    name: ci/test
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require every shard to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.shard.result }}
          RUN: ${{ github.run_id }}
          SHARDS: "6"
        run: |
          set -euo pipefail
          echo "Matrix result: ${RESULT}"
          test "${RESULT}" = success
          jobs=$(gh api --paginate "repos/${REPO}/actions/runs/${RUN}/jobs?filter=latest&per_page=100")
          passed=$(printf '%s' "${jobs}" | jq -r '.jobs[] | select(.name | startswith("ci/test shard ")) | select(.conclusion == "success") | .name' | sort -u)
          expected=$(seq 1 "${SHARDS}" | sed 's|^|ci/test shard |' | sort -u)
          if [ "${passed}" != "${expected}" ]; then
            echo "::error::Not every shard passed. Passed: $(printf '%s' "${passed}" | tr '\n' ',')"
            exit 1
          fi
          echo "All ${SHARDS} shards passed."
