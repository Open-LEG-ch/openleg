name: CI Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/site-**"]

# Keep only the newest run for each PR, without cancelling other stack layers.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each shard runs a round-robin slice of the suite on its own runner, with
  # its own PostgreSQL and Redis. The COUNT in --shard must equal the matrix size.
  shard:
    name: ci/test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openleg
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: openleg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openleg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Require sandbox process dependencies
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          command -v pdftotext
          python -c 'import ctypes; ctypes.CDLL("libseccomp.so.2")'

      - name: Run tests
        env:
          PYTEST_ADDOPTS: "--durations=30 -o faulthandler_timeout=120"
          DATABASE_URL: postgresql://openleg:testpass@localhost:5432/openleg
          OPENLEG_TEST_VEREIN_DATABASE_URL: postgresql://openleg:testpass@localhost:5432/openleg
          OPENLEG_TEST_FORECAST_REDIS_URL: redis://127.0.0.1:6379/15
          SHARD: ${{ matrix.shard }}
        # Pass the shard as an argument: child pytest runs inherit PYTEST_ADDOPTS.
        run: bash scripts/test.sh full --shard="${SHARD}/6"

  # The required check. It always runs, so a failed or cancelled shard can
  # never leave ci/test skipped (GitHub treats a skipped check as passing).
  # The matrix result alone can read success when a leg never got a runner,
  # so it also requires every expected shard job to have succeeded.
  # The jobs API lags: right after the last shard finishes it can still show
  # that shard running, and on a rerun it lists the shards copied from the
  # previous attempt only seconds after this job starts. The gate therefore
  # polls this attempt's jobs for up to a minute, and stops at once when a
  # shard has finished with anything but success or the matrix failed. Every
  # failure lists each shard's attempt, status and conclusion.
  test:
    name: ci/test
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require every shard to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.shard.result }}
          RUN: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHARDS: "6"
        run: |
          set -euo pipefail
          echo "Matrix result: ${RESULT}"
          expected=$(seq 1 "${SHARDS}" | sed 's|^|ci/test shard |' | sort -u)
          for poll in 1 2 3 4 5 6 7; do
            if ! jobs=$(gh api --paginate "repos/${REPO}/actions/runs/${RUN}/attempts/${RUN_ATTEMPT}/jobs?per_page=100"); then
              echo "::error::Could not read the jobs of attempt ${RUN_ATTEMPT}; no shard counts as passed."
              shards=$(for index in $(seq 1 "${SHARDS}"); do printf 'ci/test shard %s\t-\tunknown\t-\n' "${index}"; done)
              break
            fi
            # One row per expected shard: name, run_attempt, status, conclusion.
            shards=$(printf '%s\n' "${jobs}" \
              | jq -rs --argjson count "${SHARDS}" '
                  [.[].jobs[]] as $jobs
                  | range(1; $count + 1) | "ci/test shard \(.)" as $name
                  | [$jobs[] | select(.name == $name) | [.name, .run_attempt, .status, .conclusion // "-"]]
                  | (if . == [] then [[$name, "-", "missing", "-"]] else . end)[]
                  | @tsv')
            passed=$(printf '%s\n' "${shards}" | awk -F '\t' '$4 == "success" { print $1 }' | sort -u)
            if [ "${RESULT}" = success ] && [ "${passed}" = "${expected}" ]; then
              echo "All ${SHARDS} shards passed."
              exit 0
            fi
            if [ "${RESULT}" != success ] \
              || printf '%s\n' "${shards}" | awk -F '\t' '$3 == "completed" && $4 != "success" { found = 1 } END { exit !found }'; then
              break
            fi
            if [ "${poll}" -lt 7 ]; then
              echo "Poll ${poll}: not every shard has passed yet; checking again in 10 s."
              sleep 10
            fi
          done
          echo "::error::Not every shard passed in attempt ${RUN_ATTEMPT} (matrix result: ${RESULT})."
          echo "Shard jobs (name, run_attempt, status, conclusion):"
          printf '%s\n' "${shards}"
          exit 1
